# conf/data/default_mini.yaml

# --- 定义处理后的数据位置 ---
# 移除下面的定义，因为它们移到了 paths/default.yaml
# distance_vectors_dir: ${paths.processed_data_dir}/distance_vectors
# bmu_indices_dir: ${paths.processed_data_dir}/BMU

salt:
  data: ${paths.raw_data_dir}/salt_grid.npy
  lonlat: ${paths.raw_data_dir}/salt_lonlat_grid.npy
  mask: ${paths.raw_data_dir}/mask.npy
mesh:
  vertices: ${paths.raw_data_dir}/vertices.npy
  triangles: ${paths.raw_data_dir}/triangles.npy

wind:
  data: ${paths.raw_data_dir}/wind.npy
  lonlat: ${paths.raw_data_dir}/wind_lonlat.npy
flow: ${paths.raw_data_dir}/flow.npy

# --- 定义特征加载模式 ---
feature_loading:
  bmu_index:
    # 保持引用不变，现在可以正确找到 paths.bmu_indices_dir
    file_pattern: "${paths.bmu_indices_dir}/{field}/bmu_indices_{split}.npy"
  distance_vector:
    # 保持引用不变，现在可以正确找到 paths.distance_vectors_dir
    file_pattern: "${paths.distance_vectors_dir}/{field}/{split}_distance_vectors.npy"

coords_filename: "salt_lonlat_grid.npy"

# --- 原始数据维度 (保持) ---
salinity_dim: 5000 # 示例
wind_dim: 2000     # 示例: 原始风场维度 (可能仍有用)

# --- 预计算的 PCA 风场维度 (重要) ---
# 修改: 设置为你预计算的 PCA 组件数量
wind_pca_dim: 15 # 例如: 16 或你实际使用的组件数

# --- 数据分割名称 (保持) ---
splits: ['train', 'val', 'test']

# --- 指向 paths 配置的引用 (更新) ---
processed_data:
  salinity: ${paths.processed_paths.salinity}
  wind_pca: ${paths.processed_paths.wind_pca} # 指向预计算的 PCA 低维数据
scalers: ${paths.scaler_paths}
pretrained_models:
  wind_pca: ${paths.pretrained_pca_model_path} # 添加 PCA 模型路径引用