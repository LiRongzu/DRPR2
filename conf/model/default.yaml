# conf/model/default.yaml
# --- 选择降维方法 ---
dimensionality_reduction:
  target_feature: "salinity" # 目标特征
  method: pca # 可选项: som, pca, autoencoder
  som: # 如果 method 是 som，保留 SOM 特定参数
    # map_size 现在在 training 配置中
    learning_rate: 0.1
    neighborhood_size: null
    # seed: 42
    training:
      save_frequency: 10
      early_stopping: true
      patience: 5
  pca: # 添加 PCA 特定参数
      target_features: ["salinity", "wind"]
      n_components_salinity: 20  # 默认值
      n_components_wind: 10      # 默认值

  autoencoder: # 添加 Autoencoder 特定参数
     encoding_dim: 15 # 示例值
     hidden_layers: [64, 32] # 示例值
     activation: 'ReLU' # 激活函数
     dropout_rate: 0.1
     batch_size: 64
     learning_rate: 0.001
     epochs: 100
     loss_function: 'mse' # 损失函数
     weight_decay: 0.0001


# --- 选择预测方法 ---
prediction:
  method: lstm # 可选项: hmm, lstm
  lstm: # 如果 method 是 lstm，保留 LSTM 参数
      input_type: bmu_rank # 也可以是continuous_vector、 continuous、 bmu_rank
      hidden_size: 64
      num_layers: 2
      dropout: 0.1
      sequence_length: 10 # 输入 LSTM 的序列长度
      batch_size: 32
      epochs: 100
      lr: 0.001
      embedding_dim: 32 # 如果添加了 Embedding 层
      patience: 10 # 提前停止的耐心值
      use_observation_features: true   # 控制开关
      observation_features: ['flow', 'wind'] # 指定哪些是观测特征 (如果 use_observation_features=true)

  lstm_pca:
      # List of features whose PCA components are used as LSTM input
      # input_features: ["wind", "salinity"] # Example: use both wind and salinity PCA components
      # input_features: ["wind"]           # Example: use only wind PCA components
      input_features: ["salinity"]       # 只包含需要PCA的特征，不要包含flow
      dropout: 0.1
      # Feature whose PCA components the LSTM should predict
      target_feature: "salinity"
      external_features: ["flow"]        # flow 只作为外部特征，直接输入LSTM
      # Inherit or define specific LSTM hyperparameters for this workflow
      sequence_length: ${model.prediction.lstm.sequence_length} # Inherit general LSTM param
      hidden_size: 32                   # Or define specific value
      num_layers: 2
      patience: 100
      learning_rate: 0.001
      num_epochs: 100
      batch_size: 32
      # sequence_length: 10

  lstm_ae:
    # List of features whose PCA components are used as LSTM input
    # input_features: ["wind", "salinity"] # Example: use both wind and salinity PCA components
    # input_features: ["wind"]           # Example: use only wind PCA components
    # input_features: ["salinity"]       # Example: use only salinity PCA components
    output_size: ${model.dimensionality_reduction.autoencoder.encoding_dim}
    # input_size: 在 pipeline 中计算: ae.encoding_dim + data.wind_pca_dim
    # Feature whose PCA components the LSTM should predict
    target_feature: "salinity"
    external_features: ["flow"]
    # Inherit or define specific LSTM hyperparameters for this workflow
    sequence_length: ${model.prediction.lstm.sequence_length} # Inherit general LSTM param
    hidden_size: 32                   # Or define specific value
    num_layers: 2
    patience: 100
    learning_rate: 0.001
    epochs: 100
    batch_size: 32
    dropout: 0.1
    # sequence_length: 10

  input_sources:
    use_salinity: true  # 是否使用潜空间盐度数据
    use_wind: False      # 是否使用PCA风场数据
    use_flow: False     # 是否使用流场数据

  hmm: # 如果 method 是 hmm，保留 HMM 参数
    # n_states: 10
    observation_features: ["wind", "flow"] # 对于观测 SOM/BMU 仍然需要
    smoothing_epsilon: 1.0e-7
    # --- 新增：添加 HMM 输入类型标志 ---
    input_type: bmu_rank 

# --- 风场数据处理 (现在只是加载预处理结果) ---FAE
wind_processing:
  method: precomputed_pca # 指明使用预计算的 PCA 结果

device:
  use_gpu: true
  cuda_device: "cuda:0"
