data:
  paths:
    raw_data_dir: ${project.data_dir}/raw/mini
    processed_data_dir: ${project.data_dir}/processed/mini
    distance_vectors_dir: ${project.data_dir}/processed/mini/distance_vectors
    salt:
      data: ${data.paths.raw_data_dir}/salt_grid.npy
      lonlat: ${data.paths.raw_data_dir}/salt_lonlat_grid.npy
      mask: ${data.paths.raw_data_dir}/mask.npy
    mesh:
      vertices: ${data.paths.raw_data_dir}/vertices.npy
      triangles: ${data.paths.raw_data_dir}/triangles.npy
      mask: ${data.paths.raw_data_dir}/mask.npy
    wind:
      data: ${data.paths.raw_data_dir}/wind.npy
      lonlat: ${data.paths.raw_data_dir}/wind_lonlat.npy
    flow: ${data.paths.raw_data_dir}/flow.npy
    models:
      som: ${project.result_dir}/som_model.pkl
      lstm: ${project.result_dir}/lstm_model.pt
model:
  dim_reduction:
    methods:
    - som
    - pca
    - autoencoder
    - pod
    som:
      map_size:
      - 10
      - 10
      sigma: 1.0
      learning_rate: 0.5
      iterations: 300
      save_mean_values: true
      target_fields:
      - salinity
      - wind
      SOM_GRID_SIZE:
      - 10
      - 10
      SOM_SIGMA: 1.0
      SOM_LEARNING_RATE: 0.5
      SOM_ITERATIONS: 300
      model_path: null
    pca:
      n_components: 50
      model_path: null
  device:
    use_gpu: true
    cuda_device: cuda
    gpu_memory_fraction: 0.8
  experiment_management:
    max_experiments: 10
    max_age_days: 30
    cleanup_enabled: true
    backup_enabled: true
  prediction:
    lstm:
      units: 128
      num_layers: 2
      dropout: 0.2
      epochs: 100
      batch_size: 32
      sequence_length: 10
      embedding_dim: 16
    hmm:
      n_components: 10
      covariance_type: diag
      n_iter: 100
      tol: 0.001
      verbose: true
      random_state: ${training.random_seed}
      input_feature: distance_vector
      use_conditional_features: true
  path1_reconstruction:
    method: local_pca_knn
    neighborhood_size: 10
    pca_components: 10
    manifold_input_feature: distance_vector
training:
  data_split:
    train_test_split: 0.8
    validation_split: 0.2
  random_seed: 42
  optimizer:
    learning_rate: 0.001
    weight_decay: 1.0e-05
    early_stopping:
      patience: 10
      min_delta: 0.0001
    scheduler:
      type: reduce_on_plateau
      patience: 5
      factor: 0.5
  som_features:
    SOM_GRID_SIZE:
    - 10
    - 10
    SOM_SIGMA: 1.0
    SOM_LEARNING_RATE: 0.5
    SOM_ITERATIONS: 300
    RANDOM_SEED: 42
  logging:
    level: INFO
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    date_format: '%Y-%m-%d %H:%M:%S'
visualization:
  figure:
    size:
    - 12
    - 8
    dpi: 100
    cmap: viridis
  save:
    format: png
    dpi: 300
  animation:
    fps: 10
    save_format: mp4
reconstruction:
  target_field: salinity
  output_dir: ${project.result_dir}/reconstructed_${target_field}
  manifold:
    method: local_pca_knn
    neighborhood_size: 10
    pca_components: 5
    optimization_method: L-BFGS-B
    max_iterations: 100
    gradient_tolerance: 1.0e-05
    use_mean_constraint: true
    predicted_dv_path: ???
    manifold_model_path: ???
  bmu:
    predicted_bmu_path: ???
    som_model_path: ???
  predicted_dv_path: ???
  manifold_model_path: ???
main:
  run_steps:
  - preprocess_raw
  - train_som
  - train_manifold
  - train_lstm
  - predict_lstm
  - reconstruct_manifold
  enable_logging: true
  save_intermediate: true
  stop_on_error: true
  report_metrics: true
project:
  name: DRPR
  version: 1.0.0
  root_dir: ${hydra:runtime.cwd}
  data_dir: ${project.root_dir}/data
  result_dir: ${project.root_dir}/results
  log_dir: ${project.result_dir}/logs
  max_experiments: 10
  max_age_days: 30
  experiment_cleanup:
    enabled: true
    retention:
      by_count: 10
      by_days: 30
  model_backup:
    enabled: true
    backup_dir: ${project.root_dir}/models
    compression: true
paths:
  processed_data_dir: ${project.data_dir}/processed/mini
  raw_data_dir: ${project.data_dir}/raw/mini
  som_models_dir: ${project.root_dir}/exp/models/som
  distance_vectors_dir: ${project.data_dir}/generate/DV
prediction_settings:
  n_predict_steps: 100
  feature_type: distance_vector
  scenario: salinity_only
  target_field: salinity
  model_load_dir: ???
  output_dir: ???
