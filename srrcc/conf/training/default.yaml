# conf/training/default.yaml

# --- 数据分割参数 ---
validation_split: 0.2
test_split: 0.1  # 预留用于最终测试的数据比例

# --- 特征配置 ---
use_scaler: true  # 是否使用标准化

# --- 训练参数 ---
batch_size: 64
epochs: 100
early_stopping:
  enabled: true
  patience: 10
  min_delta: 1.0e-4

# --- SOM训练参数 ---
som:
  map_size_sta : [6,6]
  map_size: [9,9] # 提供sal的地图尺寸
  map_size_obs : [9,9] # 提供obs的地图尺寸
  learning_rate: 0.1
  n_iterations: 200
  neighborhood_size: null
  sigma: 1.0

# --- 随机种子 ---
random_seed: 42

# --- 日志配置 ---
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  to_file: true
  filename: "training.log"