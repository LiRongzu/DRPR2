# conf/config.yaml

defaults:
  - data: default_mini 
  - model: default
  - training: default
  - visualization: default
  - reconstruction: default
  - evaluation: default  # 添加评估配置
  - paths: default
  - _self_

# Hydra 配置
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${hydra.job.name}
  job:
    chdir: true

# 重建步骤配置
reconstruction:
  target_field: "salinity"
  output_format: "npy"
  # manifold_model_path: ${paths.manifold_models_dir}/latest.pkl # 如果使用流形，确保路径基于 cfg.paths
  # predicted_dv_path: ${paths.processed_data_dir}/dv_predicted.npy # 如果使用流形，确保路径基于 cfg.paths
  bmu:
    # 这些路径将在 Python 脚本中基于 cfg.paths 构造或引用
    map_size: ${training.som.map_size}
    use_prototypes: false # <--- 确认设为 false
    
# 预测步骤配置
prediction:
  split: "val" # 或 "test"
  evaluate: true
  hmm:
    # 参数加载路径将由 run_pipeline.py 使用 cfg.paths.hmm_params_standard_file 决定
    smoothing_epsilon: 1.0e-7
  lstm: # 如果使用 LSTM，确保模型和 scaler 路径基于 cfg.paths
    model_load_path: ${paths.lstm_models_dir}/latest.pt # 示例
    scaler_load_path: ${paths.processed_data_dir}/lstm_scaler.pkl # 示例
